name: Test and Package for IRIS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rule-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rule-editor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build static web assets
        run: npm run build
      - name: Set release version
        if: github.ref_type == 'tag'
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build IPM module and deployment ZIP
        run: npm run package:iris
      - name: Upload deployment ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iris-interop-tools-zip
          path: rule-editor/artifacts/*.zip
          if-no-files-found: error
      - name: Upload unpacked IPM module
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iris-interop-tools-ipm
          path: rule-editor/artifacts/iris-interop-tools-*/
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iris-interop-tools-zip
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes